name: Release

# Manual release: run from the Actions tab (or `gh workflow run release.yml -f bump=patch`).
# Publishes to npm with provenance via OIDC trusted publishing, no NPM_TOKEN secret.
# One-time per package: npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "master" ]; then
            echo "Releases must be run from master. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version and create local tag
        id: bump
        run: |
          tag=$(npm version ${{ inputs.bump }} -m 'chore(release): %s')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Smoke test packed package
        run: npm run smoke:package
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
      - name: Push release commit and tag
        run: |
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.bump.outputs.tag }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --title "${{ steps.bump.outputs.tag }}" --generate-notes
