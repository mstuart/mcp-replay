name: Package or release issue
description: Report npm package contents, metadata, provenance, or release workflow problems
title: "release: "
labels: [release]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - npm package contents
        - exports or types
        - engines metadata
        - provenance
        - release workflow
        - documentation
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
